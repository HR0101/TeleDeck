name: iPad CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ipad-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile iPad app and tests
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Compile app and test targets
        run: >-
          xcodebuild
          build-for-testing
          -project TeleDeck.xcodeproj
          -scheme TeleDeck
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/TeleDeckDerivedData"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
